apiVersion: v1
kind: Pod
metadata:
  name: logstash-es
spec:
  nodeSelector:
    cloud.google.com/gke-nodepool: es-rally-node-big5
  containers:
    - name: logstash
      image: ugosan/logstash-custom:8.8.2-dev
      imagePullPolicy: Always
      env:
        - name: GCP_FILE_MATCH_REGEX
          value: "2025-08-06/.*\\.gz"
        - name: USERNAME
          value: "elastic"
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: es-cluster-es-elastic-user
              key: elastic
      resources:
        limits:
          memory: "12Gi"
          cpu: "3"
        requests:
          memory: "12Gi"
          cpu: "3"
      volumeMounts:
        - name: config-volume
          mountPath: /usr/share/logstash/config
        - name: tmp-volume
          mountPath: /tmp/logstash/
        - name: pipeline-volume
          mountPath: /tmp/logstash/pipelines
        - name: credentials
          mountPath: /tmp/logstash/credentials
  volumes:
    - name: tmp-volume
      emptyDir: {}
    - name: config-volume
      configMap:
        name: logstash-configmap-es
        items:
          - key: pipelines.yml
            path: pipelines.yml
          - key: logstash.yml
            path: logstash.yml
    - name: credentials
      secret:
        secretName: google-cloud-storage-credentials
        items:
          - key: encoded
            path: credentials.json
    - name: pipeline-volume
      configMap:
        name: logstash-configmap-es
        items:
          - key: big5-benchmark.conf
            path: big5-benchmark.conf

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-configmap-es
data:
  pipelines.yml: |
    - pipeline.id: big5-benchmark
      path.config: "/tmp/logstash/pipelines/big5-benchmark.conf"
      pipeline.batch.size: 4000
  logstash.yml: |
    log.level: info

  big5-benchmark.conf: |
    input {
        google_cloud_storage {
            bucket_id => "big5-benchmarking"
            file_matches => "${GCP_FILE_MATCH_REGEX}"
            codec => json_lines
            json_key_file => "/tmp/logstash/credentials/credentials.json"
            interval => 300
            metadata_key => "elasticsearch-27-aug-2025-attempt-1"
        }
    }

    filter {

        mutate {
            remove_field => ["path", "@version", "host", "data_stream"]
            copy => {
              "[@metadata][gcs][name]" => "[meta][file]"
            }
        }

    }

    output {

        elasticsearch {
            hosts => "https://es-cluster-es-http.default.svc.cluster.local:9200"
            ssl => true
            ssl_certificate_verification => false
            document_id => "%{[@metadata][gcs][line_id]}"

            user => "${USERNAME}"
            password => "${PASSWORD}"

            data_stream => "true"
            data_stream_type => "logs"
            data_stream_dataset => "benchmark"
            data_stream_namespace => "dev"
        }

    }
